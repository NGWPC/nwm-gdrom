site_name: nwm-gdrom
site_description: GDROM v2 reservoir operation rules packaged for the National Water Model T-Route routing engine.
site_author: Taher Chegini

repo_name: NGWPC/nwm-gdrom
repo_url: https://github.com/NGWPC/nwm-gdrom
edit_uri: edit/main/docs/

copyright: Copyright &copy; Taher Chegini

theme:
  name: materialx
  features:
  - content.code.copy
  - content.code.annotate
  - content.tabs.link
  - content.action.edit
  - navigation.instant
  - navigation.tracking
  - navigation.tabs
  - navigation.sections
  - navigation.expand
  - navigation.indexes
  - navigation.top
  - search.highlight
  - search.suggest
  - toc.follow
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: indigo
    accent: indigo
    toggle:
      icon: material/weather-night
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: indigo
    accent: indigo
    toggle:
      icon: material/weather-sunny
      name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

nav:
- Home: index.md
- Installation: installation.md
- Quickstart: quickstart.md
- CLI reference: cli.md
- Catalog format: catalog-format.md
- Examples:
  - examples/index.md
  - Release response to inflow: examples/release_response.ipynb
- API reference: api.md
- Design notes: design.md
- Changelog: CHANGELOG.md
- License: LICENSE.md

hooks:
- docs/hooks.py

exclude_docs: |
  hooks.py
  __pycache__/
  examples/*.py

plugins:
- search
- autorefs
- mkdocs-jupyter:
    include: ['*.ipynb']
    include_source: true
    execute: false
    ignore_h1_titles: true
- mkdocstrings:
    default_handler: python
    handlers:
      python:
        paths: [src]
        options:
          docstring_style: numpy
          show_root_heading: true
          show_source: false
          show_signature_annotations: true
          separate_signature: true
          merge_init_into_class: true
          heading_level: 2
          members_order: source
          filters: ['!^_']

markdown_extensions:
- admonition
- attr_list
- def_list
- footnotes
- md_in_html
- tables
- toc:
    permalink: true
- pymdownx.details
- pymdownx.highlight:
    anchor_linenums: true
    line_spans: __span
    pygments_lang_class: true
- pymdownx.inlinehilite
- pymdownx.snippets
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format
- pymdownx.tabbed:
    alternate_style: true

extra:
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/NGWPC/nwm-gdrom
