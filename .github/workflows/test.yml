name: CI

on:
  push:
    branches:
    - '**'
    tags-ignore:
    - '**'
  pull_request:
    branches:
    - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unit - ${{ matrix.environment }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        environment: [test312, test314]

    steps:
    - uses: actions/checkout@v7
    - uses: prefix-dev/setup-pixi@v0.10.2
      with:
        pixi-version: v0.81.0
        environments: ${{ matrix.environment }}
        activate-environment: ${{ matrix.environment }}
        locked: true
    - name: Run unit tests (small fixture set; fulldata-marked tests skipped)
      run: pixi r test
