[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-vcs",
  "hatchling",
]

[project]
name = "nwm-gdrom"
description = "GDROM v2 reservoir operation rules packaged for the National Water Model T-Route routing engine."
readme = "README.md"
license = { text = "BSD-2-Clause AND Apache-2.0" }
authors = [ { name = "Taher Chegini", email = "cheginit@gmail.com" } ]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Hydrology",
  "Typing :: Typed",
]
dynamic = [
  "version",
]
dependencies = [
  "numpy>=2",
  "pandas>=2",
]
optional-dependencies.crosswalk = [
  # Optional: only needed for the GRAND_ID → NHF nhf_lake_id crosswalk module
  "geopandas>=1",
  "pyogrio",
  "shapely>=2",
]
optional-dependencies.dev = [
  "git-cliff",
  "ipykernel",
  "ipywidgets",
  "jupytext",
  "matplotlib",
  "nbconvert",
  "pandas-stubs",
  "pytest",
]
optional-dependencies.docs = [
  "jupytext",
  "mkdocs>=1.6",
  "mkdocs-jupyter",
  "mkdocs-materialx",
  "mkdocstrings[python]>=0.27",
  "ruff",
]
optional-dependencies.lint = [
  "codespell",
  "pre-commit",
]
optional-dependencies.test = [
  "coverage[toml]",
  "pytest-cov",
  "pytest-sugar",
]
optional-dependencies.typecheck = [
  "numpy",
  "pandas-stubs",
  "pyright",
]
urls."Release Artifacts" = "https://github.com/NGWPC/nwm-gdrom/releases/latest"
urls.Changelog = "https://github.com/NGWPC/nwm-gdrom/blob/main/CHANGELOG.md"
urls.CI = "https://github.com/NGWPC/nwm-gdrom/actions"
urls.Documentation = "https://github.com/NGWPC/nwm-gdrom/tree/main/docs"
urls.Homepage = "https://github.com/NGWPC/nwm-gdrom"
urls.Issues = "https://github.com/NGWPC/nwm-gdrom/issues"
scripts.nwm-gdrom = "nwm_gdrom.cli:main"

[tool.hatch]
version.source = "vcs"
build.targets.wheel.packages = [
  "src/nwm_gdrom",
]

[tool.pixi.workspace]
channels = [ "conda-forge" ]
platforms = [ "linux-64", "osx-64", "osx-arm64", "win-64" ]

[tool.pixi.pypi-dependencies]
nwm_gdrom = { path = ".", editable = true }

[tool.pixi.tasks]
release = { cmd = "git tag -a {{ version }} -m {{ version }} && git push && git push --tags", args = [
  { arg = "version" }
] }

[tool.pixi.feature.dev.tasks]
changelog = "git cliff -c pyproject.toml --unreleased"
changelog-update = "git cliff -c pyproject.toml -o CHANGELOG.md"
nb-sync = "jupytext --sync docs/examples/*.py"
nb-execute = "jupyter nbconvert --to notebook --execute --inplace docs/examples/*.ipynb"
nb-run = { depends-on = [ "nb-sync", "nb-execute" ] }
nb-pair = "jupytext --set-formats 'ipynb,py:percent' docs/examples/*.ipynb"
nb-clear = "jupyter nbconvert --ClearOutputPreprocessor.enabled=True --to notebook --inplace docs/examples/*.ipynb"

[tool.pixi.feature.docs.tasks]
docs-build = "mkdocs build --strict"
docs-serve = { cmd = "mkdocs serve", depends-on = [ "docs-build" ] }

[tool.pixi.feature.lint.tasks]
lint = "pre-commit run --all-files"
pcupdate = "pre-commit autoupdate"
spell = "codespell -w"

[tool.pixi.feature.py312.dependencies]
python = "~=3.12.0"

[tool.pixi.feature.py314.dependencies]
python = "~=3.14.0"

[tool.pixi.feature.release.dependencies]
python = "~=3.14.0"

[tool.pixi.feature.release.tasks]
# Build the full-CONUS catalog .npz artifact via the package CLI. Used both
# locally (smoke test) and by the GitHub release workflow.
build-catalog = "nwm-gdrom --source-dir data --out dist/nwm_gdrom_catalog.npz"
# Just normalize the source layout under ./data without building the catalog.
prepare-data = "nwm-gdrom --source-dir data --download-only"

[tool.pixi.feature.test.tasks]
test = "pytest -m 'not network'"
test-network = "pytest -m network"
test-all = "pytest"
report = { cmd = [ "coverage", "report" ], depends-on = [ "test-all" ] }
html = { cmd = [ "coverage", "html" ], depends-on = [ "report" ] }

[tool.pixi.feature.typecheck.tasks]
typecheck = "pyright"

[tool.pixi.environments]
dev = { features = [ "dev", "py314" ] }
test312 = { features = [ "test", "py312" ] }
test314 = { features = [ "test", "py314" ] }
typecheck = { features = [ "typecheck", "py314" ] }
lint = { features = [ "lint", "py314" ], no-default-feature = true }
docs = { features = [ "docs", "py314" ] }
crosswalk = { features = [ "crosswalk", "dev", "py314" ] }
release = { features = [ "release", "py314" ] }

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [ ".pixi", "__pycache__", "data" ]
lint.select = [ "ALL" ]
lint.ignore = [
  "ANN",
  "ARG",
  "C901",    # parser file-level complexity is intrinsic
  "COM",
  "CPY001",  # license lives in LICENSE, no per-file headers
  "D",
  "E501",
  "EXE001",  # shebangs marked +x via chmod, not always preserved across packaging
  "FBT",
  "FIX",
  "ISC001",
  "N",
  "PLC0415",
  "PLR0913",
  "PLR0917",
  "PLR2004",
  "S101",    # `assert` is fine for invariants in non-test code
  "TC001",
  "TC003",
  "TD",      # we use plain `# TODO:` comments without enforced format
  "TRY301",
]
lint.per-file-ignores."docs/*.py" = [
  "A001",
  "INP001",
]
lint.per-file-ignores."docs/examples/*.ipynb" = [
  "B018",
  "D100",
  "ERA001",
]
lint.per-file-ignores."docs/examples/*.py" = [
  "B018",
  "D100",
  "ERA001",
]
lint.per-file-ignores."src/nwm_gdrom/cli.py" = [
  "PLR0912", # round-trip validation block has many branches by design
  "PLR0915", # CLI orchestrator naturally has many statements
  "T201",    # CLI prints status to stdout
]
lint.per-file-ignores."src/nwm_gdrom/rule_catalog.py" = [
  "PLR0915", # build_catalog orchestrates parse + pack + enrichment + validation
]
lint.per-file-ignores."tests/*.py" = [
  "B015",
  "B017",
  "B018",
  "BLE001",
  "DTZ",
  "EM",
  "INP001",
  "PLR0124",
  "PT011",
  "PT012",
  "RUF012",
  "S",
  "SIM201",
  "SIM202",
  "SIM300",
  "TRY",
]
lint.extend-safe-fixes = [
  "E402",
  "PT018",
  "TID252",
]
# Lazy-imports are not required for now: the public API is small, the
# package's hot path is t-route's catalog load (numpy only), and putting all
# imports at the top makes the modules easier to read. We'll revisit if
# `import nwm_gdrom` startup time becomes a problem.
lint.isort.known-first-party = [ "nwm_gdrom" ]
lint.isort.required-imports = [ "from __future__ import annotations" ]

[tool.codespell]
ignore-words-list = "trough"
skip = "__pycache__,_build,.mypy_cache,.git,./htmlcov,.pixi,pixi.lock,**.ipynb,**.csv,LICENSE"

[tool.pyproject-fmt]
max_supported_python = "3.14"
expand_tables = [ "tool.git-cliff", "tool.pixi" ]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = [ "src" ]
ignore = [
  "docs/examples/*.{py,ipynb}",
  "tests/*.py",
]
reportMissingTypeStubs = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false

[tool.pytest]
ini_options.testpaths = [
  "tests",
]
ini_options.addopts = [
  "--import-mode=importlib",
  "-v",
  "--cov",
  "--cov-append",
  "--cov-branch",
  "--junitxml=junit.xml",
  "--durations=5",
  "--basetemp=.pytest_tmp",
]
ini_options.markers = [
  "fulldata: tests that require the full GDROM v2 source data under ./data/",
  "network: tests that make requests to external services",
]
ini_options.doctest_optionflags = "NORMALIZE_WHITESPACE IGNORE_EXCEPTION_DETAIL NUMBER"

[tool.coverage]
run.source_pkgs = [
  "nwm_gdrom",
]
run.branch = true
run.parallel = true
paths.source = [ "src", "*/site-packages" ]
report.omit = [
  "**/__init__.py",
]
report.exclude_lines = [
  "if sys.platform",
  "if TYPE_CHECKING:",
]
report.ignore_errors = true

[tool.git-cliff.changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.
The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
body = """
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}

{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{%- for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{{ commit.message | split(pat="\\n") | first | upper_first | trim }}\
{% if commit.breaking %} (**breaking**){% endif %}\
{% if commit.remote.username %} by @{{ commit.remote.username }}{% endif %}\
{% if commit.remote.pr_number %} in \
[#{{ commit.remote.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.remote.pr_number }})\
{% endif %}
{%- endfor %}
{% endfor %}

{%- if github.contributors | filter(attribute="is_first_time", value=true) | length != 0 %}
### New Contributors
{% for contributor in github.contributors | filter(attribute="is_first_time", value=true) %}
- @{{ contributor.username }} made their first contribution\
{% if contributor.pr_number %} in \
[#{{ contributor.pr_number }}]({{ self::remote_url() }}/pull/{{ contributor.pr_number }})\
{% endif %}
{%- endfor %}
{% endif %}\n
"""
footer = """
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}

{% for release in releases -%}
{% if release.version -%}
{% if release.previous.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: \
{{ self::remote_url() }}/compare/{{ release.previous.version }}...{{ release.version }}
{% endif -%}
{% else -%}
{% if release.previous.version -%}
[unreleased]: {{ self::remote_url() }}/compare/{{ release.previous.version }}...HEAD
{% endif -%}
{% endif -%}
{% endfor %}"""
trim = true

[tool.git-cliff.git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Changed" },
  { message = "^refactor", group = "Changed" },
  { message = "^revert", group = "Fixed" },
  { message = "^style", group = "Changed" },
  { message = "^docs", skip = true },
  { message = "^test", skip = true },
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  { message = "^build", skip = true },
  { message = "\\[skip ci\\]", skip = true },
  { message = "^Merge", skip = true },
]
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "newest"

[tool.jupytext]
formats = "ipynb,py:percent"
notebook_metadata_filter = "kernelspec,jupytext"
cell_metadata_filter = "-all"
